# ========================================================
# Hera Aspect data processing pipeline 
# Example configuration file example
# 
# Usage:
# aspect run --config configs/example.yaml
#
# Copy this file to e.g.:
#   configs/pipeline.yaml
# and edit the paths and settings as needed.
# For detailed descriptions of the fields check README.md
# ========================================================


# --------------------------------------------------------
# Run-time settings
# 
# --------------------------------------------------------
run:

  # (Required) Path to input data. Relative to this config file or absolute.
  input_dir: "../data/simulated/didy-boulders-didysmoothed-10km"
  # input_dir: "../outputs/simulated"

  # (Optional) Root output directory for generated products. Absolute or empty. If left empty the files are saved to outputs/<missphase>.
  output_dir: "../outputs/"

  # (Optional) SPICE meta kernel path. Should be absolute. Optional only from the pipeline perspective.
  # spice_dir: "/Users/valtterimj/Downloads/Work/Aalto/Hera/hera_spice/kernels/mk/hera_plan.tm"
  spice_dir: ""

  # Overwrite existing outputs if they already exists
  overwrite: true

# --------------------------------------------------------
# Calibration settings
#   all calibration related files should be inside calibration_dir.
#   Define the relative paths to specific files inside the calibration dir.
#   
# --------------------------------------------------------
calibration: 

  # (Required for level 1) Path to directory containing calibration files. Relative to this config file or absolute.
  # Must include:
  # DARKS/ with relevant dark files. Dark should be fits file with the frame is in the PrimaryHDU
  # FLATS/ with relevant flat fields. Flat should be fits file with the frame is in the PrimaryHDU
  # BADPIXELS/ with relevant badpixels. Bad pixel list should be a txt file.
  # RADIANCE/ with relevant radiance. Radiance should be a txt file.
  calibration_dir: "../calibration/SIMULATED"

  # Solar spectral irradiance. Relative to this config file or absolute.
  # Should be csv file
  solar_ssi: "../calibration/SOLAR/ssi_yearly_avg_e2024_c20250221.csv"

  # Drop first frame 
  drop_first_frame: False


# --------------------------------------------------------
# Metadata settings
# All these fields are required for the pipeline to work
# --------------------------------------------------------
data:

  # Camera ID
  instrume: "ASPECT"

  # Mission
  origin: "ESA-HERA"

  # Software identification
  swcreate: "ASPECTCAL"

  # Mission phase ID
  #simulated
  missphas: "simulated"

  # Mission observation ID
  observ: "pipeline-testing"

  # Observed target
  object: "didy"

  # Observed target (SPICE)
  target: "didy"

  # Solar distance
  # Manually set the solar distance, used in reflectance calibration.
  # Warning setting this value will override the solar distance from SPICE kernel
  # usage: solar disrtance in AU E.G. "1" or "1.2" | "" or None if not used.
  solar_d: ""


# --------------------------------------------------------
# Pipeline settings
# All these fields are required for the pipeline to work
# --------------------------------------------------------
pipeline:

  # List of pipeline levels to execute.
  # Values: "0", "1", "1A", "1B", "1C", "2B", "3", "3A", "3B", "3C"
  # E.g. ["0","1"]
  levels: ["0", "1", "2", "3"]
  levels: ["0", "1", "2", "3"]

  # List of channels included in processin
  # Values: "Vis", "NIR1", "NIR2", "SWIR"
  # E.g. ["NIR1", "NIR2"]
  channels: ["Vis", "NIR1", "NIR2"]
  channels: ["Vis", "NIR1", "NIR2"]

# --------------------------------------------------------
# Level_3 analysis settings
# These are only validated in level 3.
# pipeline.levels field will determine which levels are run
# --------------------------------------------------------
analysis:

  # Instrument for neural network analysis
  # (str) -> valid inputs: 'Vis-NIR1-NIR2', 'Vis-NIR1-NIR2-SWIR', 'NIR1-NIR2', 'NIR1-NIR2-SWIR'
  instrument: 'Vis-NIR1-NIR2'

  # bool -> connecting NIR segments, removing outliers, and smoothing applied or not
  data_filtering: True

  # list[str] -> which analysis are applied C = Composition, T = Taxonomy, M = MGM
  models: ['C']

  # int -> What is the wavelength in nm where NIR1 and NIR2 overlap.
  nir_overlap: 1225

  # int -> threshold for removing outliers
  # increase -> less sensitive to outliers ((deriv - mu) / sigma) > z_threshold)
  z_thresh: 1.0

  # increse -> smoother spectra (z_factor * fwhm)
  z_factor: 1.0

  # Initial guesses for MGM analysis 
  init_guess: [[0.1, 950, 150], [0.01, 1250, 50]]

# --------------------------------------------------------
# PDS4 settings
# These are only used for generating PDS4 label
# --------------------------------------------------------
pds4:

  # (required fpr pds4) relative to this file or absolute
  # The directory or file that contains the file(s) that the label is generated for
  input: "../outputs"

  # (Required for pds4) Path to directory containing the templates. Relative to this config file or absolute.
  templates_dir: "../pds4_templates"

  # (optional) Root output directory for generated products. Absolute or empty. If left empty the files are saved to input/pds4/.
  output: ""

  # (optional) A list of processing levels that the products are generated for. 
  # If input is a file this is not necessary. 
  # Setting input to point to a directory and listing here the processing levels allows to generate multiple pds4 labels.
  # Values: "0", "1", "1A", "1B", "1C", "2B", "3", "3A", "3B", "3C"
  # E.g. ["0","1"]
  products: ["0","1"]

  # (optional) A list of channels that the products are generated for
  # Values: "Vis", "NIR1", "NIR2", "SWIR"
  channels: ["Vis","NIR1","NIR2"]
