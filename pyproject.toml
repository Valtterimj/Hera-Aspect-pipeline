[project]
name = "hera-aspect-pipeline"
version = "0.1.0"
description = "The ASPECT data processing pipeline was developed to address the need for accurate calibration of instrument data, to integrate data from the four sensors, and to apply analysis algorithms to ASPECT's hyperspectral data cubes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aspect_pipeline"]